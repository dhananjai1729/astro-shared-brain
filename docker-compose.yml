services:
  neo4j:
    image: neo4j:5-community
    container_name: brain-neo4j
    environment:
      NEO4J_AUTH: neo4j/brain-pass
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p brain-pass 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: brain-pass
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      SQLITE_PATH: /data/brain.db
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic,ollama}
      MEMORY_UPDATE_MODE: ${MEMORY_UPDATE_MODE:-background}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - api_data:/data

volumes:
  neo4j_data:
  api_data:
